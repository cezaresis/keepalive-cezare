name: Gerar Calendário de Vencimentos
 
on:
  schedule:
    - cron: '0 11 * * *'   # todo dia às 11:00 UTC (08:00 no horário de Brasília)
  workflow_dispatch:         # permite rodar manualmente pelo botão "Run workflow"
 
permissions:
  contents: write
 
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Instalar dependências
        run: pip install requests
 
      - name: Gerar arquivo calendario.ics
        run: |
          python3 << 'EOF'
          import requests
          from datetime import datetime, timedelta
 
          SUPABASE_URL = "https://wyslllzgyywykijkwydn.supabase.co"
          ANON_KEY = "sb_publishable_HtfULQcDRItxRjVvbE-IxQ_DqbMT6jA"
          HEADERS = {"apikey": ANON_KEY, "Authorization": f"Bearer {ANON_KEY}"}
 
          def get(table, params=""):
              r = requests.get(f"{SUPABASE_URL}/rest/v1/{table}?{params}", headers=HEADERS)
              r.raise_for_status()
              return r.json()
 
          clientes = {c['id']: c['razao_social'] for c in get('clientes', 'select=id,razao_social')}
          processos = get('processos', 'select=*')
          produtos = get('produtos', 'select=*')
 
          def esc(t):
              t = str(t or '')
              return t.replace('\\', '\\\\').replace(';', '\\;').replace(',', '\\,').replace('\n', '\\n')
 
          lines = [
              "BEGIN:VCALENDAR", "VERSION:2.0",
              "PRODID:-//Cezare//RegistroCezare//PT", "CALSCALE:GREGORIAN",
              "X-WR-CALNAME:Vencimentos Cezare",
          ]
 
          # O evento em si passa a "aparecer" já no dia do aviso (ex: 60 dias antes) e
          # permanece visível todo dia até o vencimento, como uma faixa contínua.
          # Não dependemos mais de VALARM porque o Google Calendário ignora alarmes
          # em calendários assinados por link.
          def add_event(uid, dtstart_str, dtend_str, summary, desc, rrule=None):
              lines.append("BEGIN:VEVENT")
              lines.append(f"UID:{uid}@registrocezare")
              lines.append(f"DTSTAMP:{datetime.utcnow().strftime('%Y%m%dT%H%M%SZ')}")
              lines.append(f"DTSTART;VALUE=DATE:{dtstart_str}")
              lines.append(f"DTEND;VALUE=DATE:{dtend_str}")
              lines.append(f"SUMMARY:{esc(summary)}")
              lines.append(f"DESCRIPTION:{esc(desc)}")
              if rrule:
                  lines.append(f"RRULE:{rrule}")
              lines.append("END:VEVENT")
 
          for p in processos:
              if p.get('status_manual') == 'concluido':
                  continue
              if p.get('renova') is False:
                  continue
              cliente_nome = clientes.get(p['cliente_id'], 'Cliente')
              if p.get('aviso_mes_fixo'):
                  mes = str(p['aviso_mes_fixo']).zfill(2)
                  ano = datetime.utcnow().year
                  dtstart = f"{ano}{mes}01"
                  dtend = (datetime.strptime(dtstart, "%Y%m%d") + timedelta(days=1)).strftime("%Y%m%d")
                  add_event(
                      f"proc-{p['id']}", dtstart, dtend,
                      f"Renovação: {p['tipo']} - {cliente_nome}",
                      f"Licença/AFE nº {p.get('numero_licenca') or '-'}",
                      rrule="FREQ=YEARLY"
                  )
              elif p.get('prazo'):
                  dias = p.get('aviso_dias') or 30
                  vencimento_dt = datetime.strptime(p['prazo'], "%Y-%m-%d")
                  aviso_dt = vencimento_dt - timedelta(days=dias)
                  dtstart = aviso_dt.strftime("%Y%m%d")
                  dtend = (vencimento_dt + timedelta(days=1)).strftime("%Y%m%d")
                  add_event(
                      f"proc-{p['id']}", dtstart, dtend,
                      f"Vencimento: {p['tipo']} - {cliente_nome}",
                      f"Licença/AFE nº {p.get('numero_licenca') or '-'} | Processo {p.get('numero_processo') or '-'} | Vence em {vencimento_dt.strftime('%d/%m/%Y')}"
                  )
 
          for pr in produtos:
              if not pr.get('possui_vencimento') or not pr.get('vencimento'):
                  continue
              cliente_nome = clientes.get(pr['cliente_id'], 'Cliente')
              dias = pr.get('aviso_dias') or (360 if pr.get('classificacao') == 'registrado' else 180)
              vencimento_dt = datetime.strptime(pr['vencimento'], "%Y-%m-%d")
              aviso_dt = vencimento_dt - timedelta(days=dias)
              dtstart = aviso_dt.strftime("%Y%m%d")
              dtend = (vencimento_dt + timedelta(days=1)).strftime("%Y%m%d")
              tipo_label = 'Registro' if pr.get('classificacao') == 'registrado' else 'Notificação'
              add_event(
                  f"prod-{pr['id']}", dtstart, dtend,
                  f"Vencimento produto: {pr['nome']} - {cliente_nome}",
                  f"{tipo_label} nº {pr.get('numero') or '-'} | Vence em {vencimento_dt.strftime('%d/%m/%Y')}"
              )
 
          lines.append("END:VCALENDAR")
 
          with open('calendario.ics', 'w', encoding='utf-8') as f:
              f.write("\r\n".join(lines))
 
          print(f"Gerado com {len(processos)} processos e {len(produtos)} produtos verificados.")
          EOF
 
      - name: Publicar o arquivo atualizado
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add calendario.ics
          git diff --quiet --cached || git commit -m "Atualiza calendário de vencimentos"
          git push
